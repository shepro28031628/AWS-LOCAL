<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 140" width="520" height="140" role="img" aria-label="AWS Nube Local">
  <!-- Logo AWS Nube Local: se adapta solo al tema claro/oscuro -->
  <defs>
    <linearGradient id="cloud" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#38BDF8"/>
      <stop offset="1" stop-color="#2563EB"/>
    </linearGradient>
    <style>
      .ink { fill: #0F172A; }
      .accent { fill: #2563EB; }
      .sub { fill: #475569; }
      .base { fill: #0F172A; }
      @media (prefers-color-scheme: dark) {
        .ink { fill: #F8FAFC; }
        .accent { fill: #7DD3FC; }
        .sub { fill: #94A3B8; }
        .base { fill: #F8FAFC; }
      }
    </style>
  </defs>
  <g fill="url(#cloud)">
    <circle cx="52" cy="78" r="26"/>
    <circle cx="82" cy="56" r="34"/>
    <circle cx="116" cy="72" r="28"/>
    <rect x="52" y="72" width="64" height="32"/>
  </g>
  <path d="M62 70 l12 10 l-12 10" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="82" y="86" width="22" height="6" rx="3" fill="#FFFFFF"/>
  <rect class="base" x="40" y="112" width="88" height="6" rx="3" opacity="0.85"/>
  <text class="ink" x="164" y="78" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="46" font-weight="800" letter-spacing="-1">AWS <tspan class="accent">Nube</tspan> Local</text>
  <text class="sub" x="166" y="110" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="19" font-weight="500">Tu nube, en tu máquina</text>
</svg>
