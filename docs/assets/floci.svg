<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 140" width="520" height="140" role="img" aria-label="AWS Nube Local">
  <!-- Logo AWS Nube Local: se adapta solo al tema claro/oscuro -->
  <defs>
    <linearGradient id="nlCloud" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5EEAD4"/>
      <stop offset="1" stop-color="#A78BFA"/>
    </linearGradient>
    <linearGradient id="nlWord" gradientUnits="userSpaceOnUse" x1="262" y1="0" x2="372" y2="0">
      <stop class="w0" offset="0"/>
      <stop class="w1" offset="1"/>
    </linearGradient>
    <style>
      .ink { fill: #334155; } .sub { fill: #64748B; }
      .w0 { stop-color: #14B8A6; } .w1 { stop-color: #8B5CF6; }
      @media (prefers-color-scheme: dark) {
        .ink { fill: #F1F5F9; } .sub { fill: #94A3B8; }
        .w0 { stop-color: #5EEAD4; } .w1 { stop-color: #C4B5FD; }
      }
    </style>
  </defs>
  <g fill="url(#nlCloud)">
    <circle cx="52" cy="80" r="25"/>
    <circle cx="84" cy="58" r="33"/>
    <circle cx="118" cy="76" r="25"/>
    <rect x="52" y="76" width="66" height="29" rx="4"/>
  </g>
  <circle cx="72" cy="46" r="9" fill="#FFFFFF" opacity="0.28"/>
  <path d="M66 72 l11 9 l-11 9" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="84" y="87" width="20" height="6" rx="3" fill="#FFFFFF"/>
  <text class="ink" x="164" y="80" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="46" font-weight="700" letter-spacing="-0.5">AWS <tspan fill="url(#nlWord)">Nube</tspan> Local</text>
  <text class="sub" x="166" y="110" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="19" font-weight="500">Tu nube, en tu máquina</text>
</svg>
